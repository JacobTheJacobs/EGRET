<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Egret</title>
  <!-- Head, dagger bill and long S-curved neck: the parts of an egret that stay
       legible once a tray icon is down to 16px, where a whole bird turns to
       mush. The bill is deliberately blunt and the neck thin, so the sky-blue
       gap between them survives downscaling. Colours track the app theme. -->
  <circle cx="32" cy="32" r="31" fill="#38bdf8"/>
  <g fill="none" stroke="#0f172a" stroke-width="6.4" stroke-linecap="round">
    <path d="M25 54 C18.5 43 22 30.5 32 25.5"/>
  </g>
  <circle cx="36" cy="22.5" r="7.4" fill="#0f172a"/>
  <path d="M41 17.6 L56.5 22.5 L41 27.4 Z" fill="#0f172a"/>
  <circle cx="37.8" cy="20.6" r="1.9" fill="#38bdf8"/>
</svg>
