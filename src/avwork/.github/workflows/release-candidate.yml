name: v12-release-candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v12.*'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: bun install --frozen-lockfile
      - run: python scripts/verify_production.py
      - run: python scripts/validate_native_backends.py
      - uses: actions/upload-artifact@v4
        with:
          name: egret-release-candidate
          path: |
            dist/egret-v12-release-candidate.zip
            dist/egret-v12-release-candidate.zip.sig
            dist/release-manifest.json
            dist/release-manifest.json.sig
